<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c1a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon-192.png">
  <title>Web game | KritZaar</title>
  <link rel="stylesheet" href="/css/emulator-shared.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/play/play.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <main class="kz-wrap kzw">
    <p class="kzw-error" id="kzw-error" role="alert" hidden>That game is not available. <a href="/games/">Back to all games</a></p>
    <div class="kzw-grid" id="kzw-layout" hidden>
      <div class="kzw-col">
        <nav class="kz-crumb" id="kzw-crumb" aria-label="Breadcrumb"></nav>
        <div class="kzw-stage-wrap"><div class="kzw-stage" id="kzw-stage"></div></div>
        <div class="kzw-bar">
          <h1 id="kzw-title">Loading&hellip;</h1>
          <button type="button" class="kz-btn" id="kzw-full" hidden>⛶ Fullscreen</button>
        </div>
        <ul class="kzw-tags" id="kzw-tags"></ul>
        <section class="kzw-card" id="kzw-info" hidden>
          <h2>About this game</h2><p id="kzw-desc"></p>
          <h2>How to play</h2><p id="kzw-how"></p>
        </section>
        <p class="kzw-note">This game is provided by <strong>Playgama</strong> and runs from their servers. KritZaar does not host it. The game may show its own ads and store its own cookies. <a href="/legal/privacy.html">Privacy</a> &middot; <a href="/legal/dmca.html">Report a problem</a></p>
      </div>
      <aside class="kzw-more" id="kzw-more" aria-label="More games" hidden><h2>More games</h2><div id="kzw-grid"></div></aside>
    </div>
  </main>
  <script type="module" src="/play/play.js"></script>
</body>
</html>
